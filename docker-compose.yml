services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Events, members and feedback survive `docker compose down` (named volume below).
      STATE_FILE: /srv/state/state.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data
      - state:/srv/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  state:
